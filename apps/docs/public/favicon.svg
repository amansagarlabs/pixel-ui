<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <style>
    .bg { fill: #0a0a0a; }
    .fg { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #ffffff; }
      .fg { fill: #0a0a0a; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="64" height="64" rx="10"/>
  <g class="fg" transform="translate(14 12) scale(1.35)">
    <rect x="4" y="4" width="4" height="20"/>
    <rect x="8" y="4" width="12" height="4"/>
    <rect x="20" y="8" width="4" height="8"/>
    <rect x="8" y="16" width="12" height="4"/>
  </g>
</svg>
